<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1220">
  <!-- ホーム画面に追加したとき全画面で起動する -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="数の地平">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <title>数の地平</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-label">数</div>
    <div class="top-energy" id="count">10</div>
    <div class="top-rate" id="rate">+0 /秒</div>
  </header>

  <main id="main">
    <!-- 数える（生産） -->
    <section class="panel active" data-panel="count">
      <div class="goal" id="goal">
        <div class="goal-text" id="goal-text"></div>
        <div class="bar"><div class="bar-fill" id="goal-bar"></div></div>
      </div>
      <button class="evolve hidden" id="carry" type="button">
        <span class="evolve-title">繰り上がる</span>
        <span class="evolve-gain" id="carry-gain"></span>
      </button>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="購入数">
          <button type="button" data-buymode="one">1 個</button>
          <button type="button" data-buymode="milestone">節目まで</button>
          <button type="button" class="hidden" data-buymode="prime">素数まで</button>
          <button type="button" data-buymode="max">最大</button>
        </div>
      </div>
      <div class="toolbar auto-row hidden" id="auto-row">
        <span class="auto-label">自動購入</span>
        <div class="seg" role="group" aria-label="自動購入">
          <button type="button" data-automode="off">停止</button>
          <button type="button" data-automode="max">最大</button>
          <button type="button" data-automode="milestone">節目</button>
          <button type="button" class="hidden" data-automode="prime">素数</button>
        </div>
      </div>
      <div class="toolbar toggles">
        <button type="button" class="toggle hidden" id="auto-carry-toggle">自動繰り上がり ON</button>
      </div>
      <div class="toolbar auto-row hidden" id="auto-carry-row">
        <span class="auto-label">条件</span>
        <div class="seg" role="group" aria-label="自動繰り上がりの条件">
          <button type="button" data-carrymode="rate">効率</button>
          <button type="button" data-carrymode="amount">倍率</button>
          <button type="button" data-carrymode="time">時間</button>
        </div>
        <label class="carry-input hidden" id="carry-amount-wrap">所持の
          <input type="number" id="carry-amount" min="0.01" step="any" inputmode="decimal"> 倍</label>
        <label class="carry-input hidden" id="carry-time-wrap">
          <input type="number" id="carry-time" min="1" step="1" inputmode="numeric"> 秒</label>
      </div>
      <p class="note carry-note hidden" id="carry-note"></p>
      <ul class="tiers" id="tiers"></ul>
    </section>

    <!-- 桁（繰り上がりの強化） -->
    <section class="panel" data-panel="digits">
      <div class="genes-head">
        <div class="genes-count"><span id="digits">0</span> 桁</div>
        <div class="genes-sub" id="digits-sub"></div>
      </div>
      <h2>強化</h2>
      <ul class="upgrades" id="upgrades"></ul>
      <h2 id="repeatables-title" class="hidden">繰り返し強化</h2>
      <ul class="upgrades" id="repeatables"></ul>
      <h2>次の層へ</h2>
      <div class="expand" id="expand">
        <div class="expand-title">拡張：負の数</div>
        <div class="expand-desc">桁を 1.8e308 個手元に貯めると、数の世界を「整数」へ広げられる。強化に使うと減るので注意。</div>
        <div class="goal-text" id="expand-text"></div>
        <div class="bar"><div class="bar-fill" id="expand-bar"></div></div>
        <button type="button" class="expand-btn" id="expand-btn" disabled>第 2 層は準備中</button>
      </div>
    </section>

    <!-- 設定 -->
    <section class="panel" data-panel="settings">
      <h2>記録</h2>
      <dl class="stats" id="stats"></dl>
      <h2>セーブ</h2>
      <p class="note">自動で保存されます。機種変更などで引き継ぐときは書き出し／読み込みを使ってください。</p>
      <div class="buttons">
        <button type="button" id="save-now">今すぐ保存</button>
        <button type="button" id="export">書き出し</button>
        <button type="button" id="import">読み込み</button>
      </div>
      <textarea id="save-text" class="hidden" rows="4" spellcheck="false"></textarea>
      <h2>リセット</h2>
      <div class="buttons">
        <button type="button" class="danger" id="hard-reset">最初からやり直す</button>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button type="button" class="active" data-tab="count"><span class="tab-icon">Σ</span>数える</button>
    <button type="button" class="hidden" data-tab="digits"><span class="tab-icon">0</span>桁</button>
    <button type="button" data-tab="settings"><span class="tab-icon">⚙&#xFE0E;</span>設定</button>
  </nav>

  <div class="toast hidden" id="toast"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
