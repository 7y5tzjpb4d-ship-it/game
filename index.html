<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antimatter: First Steps</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#1b2230;--line:#344156;--text:#eef3ff;--muted:#aab6ca;--blue:#4b91ff;--green:#36c98a;--gold:#e8b84f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2940 0,#10131b 58%);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:auto;padding:22px 14px 40px}.head{text-align:center;padding:12px 0 20px}.eyebrow{letter-spacing:.18em;color:#80b5ff;font-size:12px;font-weight:800}.head h1{font-size:clamp(27px,5vw,42px);margin:6px 0}.head p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:linear-gradient(145deg,#202a3a,#171d29);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 25px #0002}.stat{text-align:center}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:clamp(18px,3vw,25px);font-variant-numeric:tabular-nums}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:18px}.section-title span{font-size:12px;color:var(--muted);font-weight:500}
.dimensions{display:grid;gap:8px}.dim{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:#171e2a;border:1px solid #2d394b;border-radius:12px;padding:11px 12px}.dim.locked{opacity:.48}.tier{height:42px;width:42px;border-radius:10px;display:grid;place-items:center;background:#263b58;color:#a9d1ff;font-size:20px;font-weight:800}.dim:nth-child(2) .tier{background:#283d36;color:#9af0c5}.dim:nth-child(3) .tier{background:#443a25;color:#ffe09a}.dim:nth-child(4) .tier{background:#402b42;color:#f0b7ff}.dim-name{font-weight:750}.dim-info{color:var(--muted);font-size:12px;margin-top:2px}.dim-amount{font-size:13px;color:#e5edff;margin-top:3px}.buy{min-width:132px;border:1px solid #568ee5;background:#244779;color:#fff;padding:10px 12px;border-radius:9px;font-weight:750;cursor:pointer}.buy:hover:not(:disabled){background:#3264a4;filter:none;transform:none;transition:none}.buy:disabled{opacity:.35;cursor:not-allowed}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.action{border-radius:12px;padding:15px;border:1px solid var(--line);background:#202b3c;color:var(--text);text-align:left}.action h3{margin:0 0 4px;font-size:16px}.action p{margin:0;color:var(--muted);font-size:12px}.action button{margin-top:11px;width:100%;padding:11px;border:0;border-radius:8px;font-weight:800;color:#111827;background:var(--gold);cursor:pointer}.action button:disabled{opacity:.35;cursor:not-allowed}.buy,.action button{transition:none;animation:none;backface-visibility:hidden}.boost{border-color:#78602e;background:linear-gradient(145deg,#332c20,#211e1b)}.boost button{background:var(--gold)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;color:var(--muted);font-size:12px}.secondary{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 10px;cursor:pointer}.notice{margin-top:12px;color:#9db0ca;font-size:12px;text-align:center}
@media(max-width:540px){main{padding:12px 10px 28px}.stats{gap:6px}.stat{padding:10px 5px}.dim{grid-template-columns:42px minmax(0,1fr);gap:9px}.tier{height:38px;width:38px}.dim .buy{grid-column:1/-1;width:100%;padding:9px}.actions{grid-template-columns:1fr}.bottom{align-items:flex-start}.head{padding-top:8px}}
</style>
</head>
<body><main>
<header class="head"><div class="eyebrow">INCREMENTAL UNIVERSE</div><h1>ANTIMATTER: FIRST STEPS</h1><p>反物質を増やし、次元を解放し、さらに速く増やそう。</p></header>
<section class="stats">
 <div class="stat"><small>反物質 / ANTIMATTER</small><strong id="matter">10</strong></div>
 <div class="stat"><small>毎秒の生産量</small><strong id="rate">0</strong></div>
 <div class="stat"><small>次元ブースト</small><strong id="boostCount">0</strong></div>
</section>
<section class="panel">
 <h2 class="section-title">次元 <span>購入すると反物質を自動生産</span></h2>
 <div class="dimensions" id="dimensions"></div>
</section>
<section class="actions">
 <div class="action boost"><h3>次元ブースト</h3><p id="boostDesc">第1次元を20個購入すると実行できます。次元をリセットし、生産倍率を上げます。</p><button type="button" id="boostBtn" disabled>次元ブースト</button></div>
 <div class="action"><h3>購入設定</h3><p>購入方法を切り替えます。まとめ買いで操作を短縮できます。</p><button type="button" id="buyModeBtn">購入: 1個ずつ</button></div>
</section>
<div class="bottom"><span id="status">ゲームは自動保存されます。</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="secondary" id="saveBtn">セーブ</button><button type="button" class="secondary" id="resetBtn">最初からやり直す</button></div></div>
<div class="notice">試作版 — 次元生産・購入倍率・次元ブーストを実装</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
function setText(el,value){const text=String(value);if(el.textContent!==text)el.textContent=text;}
const names=['第1次元','第2次元','第3次元','第4次元','第5次元','第6次元','第7次元','第8次元'];
const baseCosts=[10,100,1e3,1e6,1e9,1e13,1e18,1e24];
const unlockAt=[0,0,0,0,0,0,0,0];
const costGrowth=[1e3,1e4,1e5,1e6,1e8,1e10,1e12,1e15];
const state={matter:10,amount:Array(8).fill(0),bought:Array(8).fill(0),boosts:0,buyMax:false,last:Date.now()};
let lastSave=0,lastRender=0, rows=[];
function fmt(n){
 if(!Number.isFinite(n))return '∞';
 if(n<=0)return '0';
 if(n<1000)return Number(n.toPrecision(3)).toString();
 const e=Math.floor(Math.log10(n)),m=n/Math.pow(10,e);
 return Number(m.toPrecision(3))+'e'+e;
}
function cost(i){return baseCosts[i]*Math.pow(costGrowth[i],Math.floor(state.bought[i]/10));}
function maxAffordable(i){
 let matter=state.matter, bought=state.bought[i], count=0, spent=0, c=cost(i);
 while(count<10000 && matter>=c && Number.isFinite(c)){
  matter-=c; spent+=c; count++; bought++;
  c=baseCosts[i]*Math.pow(costGrowth[i],Math.floor(bought/10));
 }
 return {count,spent};
}
function mult(i){
 let boostMult=1;
 for(let n=1;n<=state.boosts;n++){
  const tier=i+1;
  if(n<=5 ? tier<=n : tier!==n) boostMult*=2;
 }
 return 1e6*boostMult*Math.pow(2,Math.floor(state.bought[i]/10));
}
function unlocked(i){return i<4||state.boosts>=i-3;}
function productionRate(){return state.amount[0]*mult(0)*1e12;}
function boostRequirement(){const n=state.boosts+1;return n<=5?20:15*n-55;}
function boostRequirementTier(){const n=state.boosts+1;return n<=5?n+3:8;}
function canBoost(){const n=state.boosts+1;const tier=boostRequirementTier();return state.bought[tier-1]>=boostRequirement();}
function buildRows(){
 const root=$('dimensions');root.innerHTML='';rows=[];
 for(let i=0;i<8;i++){
  const d=document.createElement('div');d.className='dim'+(unlocked(i)?'':' locked');
  const tier=document.createElement('div');tier.className='tier';tier.textContent=i+1;
  const info=document.createElement('div');
  const nm=document.createElement('div');nm.className='dim-name';nm.textContent=names[i];
  const det=document.createElement('div');det.className='dim-info';
  const amt=document.createElement('div');amt.className='dim-amount';
  info.append(nm,det,amt);
  const b=document.createElement('button');b.className='buy';b.type='button';b.onclick=()=>buy(i);
  d.append(tier,info,b);root.append(d);rows.push({d,det,amt,b});
 }
}
function render(){
 setText($('matter'),fmt(state.matter));
 setText($('rate'),fmt(productionRate()));
 setText($('boostCount'),fmt(state.boosts));
 if(rows.length!==8)buildRows();
 for(let i=0;i<8;i++){
  const {d,det,amt,b}=rows[i],open=unlocked(i),c=cost(i);
  d.className='dim'+(open?'':' locked');
  setText(det,open?'倍率 ×'+fmt(mult(i))+' ・ 10個購入ごとに倍率上昇':'次元ブースト '+(i-3)+' 回で解放');
  setText(amt,'所持数: '+fmt(state.amount[i])+'（累計購入 '+fmt(state.bought[i])+'）');
  const max=state.buyMax?maxAffordable(i):null;
  b.disabled=!open||(state.buyMax?max.count===0:state.matter<c);
  setText(b,!open?'ロック中':(state.buyMax?(max.count>0?('最大購入 '+fmt(max.count)+'個 · 消費 '+fmt(max.spent)):('最大購入 0個 · 現在の価格 '+fmt(c))):('購入 · '+fmt(c))));
 }
 const n=state.boosts+1,req=boostRequirement(),tier=boostRequirementTier(),can=canBoost();
 $('boostBtn').disabled=!can;
 const effect=n<=5?'第'+n+'次元以下の倍率が2倍になります。':'第'+n+'次元以外の倍率が2倍になります。';
 setText($('boostDesc'),'第'+tier+'次元を '+fmt(req)+' 個購入で実行。'+effect+' 現在の累計購入数: '+fmt(state.bought[tier-1])+' 個。');
 setText($('status'),'ゲームは自動保存されます。');
}
function buy(i){
 if(!unlocked(i))return;
 if(state.buyMax){const max=maxAffordable(i);for(let k=0;k<max.count;k++){const c=cost(i);state.matter-=c;state.amount[i]++;state.bought[i]++;}}
 else{const c=cost(i);if(state.matter<c)return;state.matter-=c;state.amount[i]++;state.bought[i]++;}
 render();save();
}
function boost(){
 if(!canBoost())return;
 state.boosts++;state.matter=10;state.amount=Array(8).fill(0);state.bought=Array(8).fill(0);render();save();
}
function save(){try{localStorage.setItem('antimatterFirstSteps',JSON.stringify({...state,last:Date.now()}));}catch(e){}}
function load(){
 try{const s=JSON.parse(localStorage.getItem('antimatterFirstSteps'));if(s&&Array.isArray(s.amount)&&s.amount.length===8){
  state.matter=Math.max(0,Number(s.matter)||10);state.amount=s.amount.map(x=>Math.max(0,Number(x)||0));
  if(Array.isArray(s.bought)&&s.bought.length===8)state.bought=s.bought.map(x=>Math.max(0,Number(x)||0));
  state.boosts=Math.max(0,Number(s.boosts)||0);state.buyMax=!!s.buyMax;
  const elapsed=Math.min(3600,Math.max(0,(Date.now()-(Number(s.last)||Date.now()))/1000));
  state.matter+=productionRate()*elapsed;
 }}catch(e){}
}
$('boostBtn').onclick=boost;
$('buyModeBtn').onclick=()=>{state.buyMax=!state.buyMax;$('buyModeBtn').textContent=state.buyMax?'購入: 最大購入':'購入: 1個ずつ';render();save();};
$('saveBtn').onclick=()=>{save();$('status').textContent='セーブしました';};
$('resetBtn').onclick=()=>{if(confirm('セーブデータを消して最初からやり直しますか？')){localStorage.removeItem('antimatterFirstSteps');state.matter=10;state.amount=Array(8).fill(0);state.bought=Array(8).fill(0);state.boosts=0;state.buyMax=false;$('buyModeBtn').textContent='購入: 1個ずつ';render();save();}};
load();$('buyModeBtn').textContent=state.buyMax?'購入: 最大購入':'購入: 1個ずつ';buildRows();render();
let last=performance.now();
function tick(now){
 const dt=Math.min(.25,(now-last)/1000);last=now;
 for(let i=7;i>=1;i--)state.amount[i-1]+=state.amount[i]*mult(i)*0.1*dt;
 state.matter+=productionRate()*dt;
 if(now-lastRender>200){render();lastRender=now;}
 if(now-lastSave>5000){save();lastSave=now;}
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);window.addEventListener('beforeunload',save);
})();
</script>
</body></html>
